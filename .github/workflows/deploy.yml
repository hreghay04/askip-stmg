name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Encrypt HTML pages
        run: |
          npx staticrypt@3 index.html cejm.html droit.html economie.html sgn.html \
            -p '${{ secrets.SITE_PASSWORD }}' \
            -d dist \
            --short \
            --remember 30 \
            --template-title "Klarity" \
            --template-button "Accéder au site" \
            --template-placeholder "Mot de passe" \
            --template-instructions "Entrez le mot de passe fourni par votre enseignant." \
            --template-error "Mot de passe incorrect." \
            --template-remember "Se souvenir de moi" \
            --template-color-primary "#132b38" \
            --template-color-secondary "#f0ece6"

      - name: Copy static assets
        run: |
          cp *.js *.css *.svg dist/ 2>/dev/null || true

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
